<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filakalk – kalkulátor 3D tisku</title>

<meta name="application-name" content="Filakalk">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Filakalk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef3fa;--panel:#fff;--ink:#0f1e33;--mut:#546b87;--line:#d3deec;--acc:#1d4ed8;--accink:#fff;
--c1:#0b6b5c;--c2:#e0a100;--c3:#4a6fa5;--c4:#8a5a9e;--c5:#c4553a;--c6:#16211f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--panel:#121c2f;--ink:#e6eefc;--mut:#8fa3c2;--line:#233350;--acc:#5b9dff;--accink:#06142e;--c1:#3fc5ad;--c2:#f0b92e;--c3:#7f9fd0;--c4:#b98ccc;--c5:#e0806a;--c6:#e8efed}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--panel:#121c2f;--ink:#e6eefc;--mut:#8fa3c2;--line:#233350;--acc:#5b9dff;--accink:#06142e;--c1:#3fc5ad;--c2:#f0b92e;--c3:#7f9fd0;--c4:#b98ccc;--c5:#e0806a;--c6:#e8efed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Familjen Grotesk','Segoe UI',system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{margin:8px 0 4px;line-height:0;color:var(--ink)}.wm{height:46px;width:auto;display:block}
.sub{color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:0 0 auto;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){td[data-label^="Cena"] input,td[data-label^="Hmotnost"] input{width:72px;min-width:0}
.grid{grid-template-columns:1.1fr .9fr;align-items:start}.res{position:sticky;top:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:1.05rem;margin:0 0 10px}
.f{display:grid;grid-template-columns:1fr 96px 56px;gap:8px;align-items:center;margin-bottom:8px}
.f label{font-size:.92rem}.f span{color:var(--mut);font-size:.85rem}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.fil{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.fil:first-of-type{border-top:0}.fil .w{grid-column:1/-1}
.fil small{color:var(--mut);display:block;font-size:.78rem}
.price{font-size:2.6rem;font-weight:700;line-height:1.1;margin:2px 0}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:12px 0;background:var(--line)}
.bar i{display:block;min-width:0}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
.tot{font-weight:700}
.note{color:var(--mut);font-size:.82rem;margin-top:10px}
table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
td,th{padding:5px 4px;text-align:left;font-size:.88rem}th{color:var(--mut);font-weight:500}
td input{min-width:80px}td[data-label^="Cena"] input,td[data-label^="Hmotnost"] input{text-align:right}td input[type=color],.duo input{padding:0;border:0;background:none;cursor:pointer;height:34px}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0}input[type=color]::-moz-color-swatch{border:0}
.cc{display:flex;gap:6px;align-items:center}.cc .one{min-width:0;width:72px;border:1px solid var(--line);border-radius:6px}
.duo{display:flex;width:72px;height:34px;border:1px solid var(--line);border-radius:6px;overflow:hidden}.duo input{min-width:0;width:50%;border-radius:0}
.cc .btn{margin:0;padding:4px 8px;font-size:.85rem}
.cc .btn[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.filterbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 10px;margin:0 0 10px}
.filterbar label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
.filterbar select{width:100%}
.fcount{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px;font-size:.88rem;color:var(--mut)}
.fcount .btn{margin:0;padding:5px 10px;font-size:.85rem}
.sb{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:2px 0;text-align:left}
.sb .sa{display:inline-flex;flex-direction:column;line-height:.75;font-size:.62rem}
.sb .sa i{font-style:normal;color:var(--mut);opacity:.4}
.sb .sa i.on{color:var(--acc);opacity:1}
.sb[aria-pressed=true]{color:var(--acc);font-weight:700}
.sortchips{display:none;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.sortchips .lbl2{color:var(--mut);font-size:.85rem;margin-right:2px}
.sortchips .sb{border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--bg);color:var(--ink);font-size:.88rem}
.sortchips .sb[aria-pressed=true]{border-color:var(--acc)}
@media(max-width:859px){.sortchips{display:flex}}
.sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}.sortbar label{font-size:.92rem}.sortbar select{width:auto;flex:0 1 230px;min-width:0}.sortbar .btn{margin:0;padding:7px 12px}
.colbtn{display:flex;align-items:center;gap:10px;width:100%;min-width:150px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.colbtn .sw{width:26px;height:26px;flex:0 0 26px}
.colbtn .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.colbtn[aria-expanded=true]{border-color:var(--acc)}
.palpop{position:fixed;z-index:60;width:292px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;padding:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.palpop[hidden]{display:none}
.palpop .pp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.palpop .pp-x{border:0;background:none;color:var(--mut);font:inherit;font-size:1.4rem;line-height:1;cursor:pointer;padding:0 6px}
.palpop .pp-s{color:var(--mut);font-size:.8rem;margin:10px 0 6px}
.palpop .pp-seg{display:flex;gap:6px;margin-bottom:4px}
.palpop .pp-seg .btn{flex:1;margin:0;padding:6px 8px;font-size:.88rem}
.palpop .btn[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pb{width:100%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);padding:0;cursor:pointer}
.pb[aria-pressed=true]{outline:2px solid var(--acc);outline-offset:2px}
.palpop .pp-a{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.palpop .pp-a .btn{margin:0;padding:6px 10px;font-size:.88rem}
.palpop .pp-cust{display:flex;align-items:center;gap:8px;font-size:.88rem}
.palpop .pp-cust input{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.dd{position:relative;width:100%}
.ddb{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ddb .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddl{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;max-height:280px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.ddl[hidden]{display:none}
.ddl li{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:6px;cursor:pointer}
.ddl li:hover,.ddl li[aria-selected=true]{background:var(--bg)}
.lowt{color:#c0392b;font-weight:700}
.ver{color:var(--mut);font-size:.8rem;text-align:center;margin:22px 0 0}
[hidden]{display:none!important}
.acct{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:-4px 0 14px;font-size:.9rem}
.acct .btn{margin:0;padding:6px 12px;font-size:.9rem}
.acct .who{font-weight:500;overflow-wrap:anywhere;min-width:0}
.acct .st{color:var(--mut)}
.acct .st.err{color:#c0392b}
.emailf{display:grid;gap:8px;margin:0 0 14px;max-width:420px}
.emailf label{font-size:.92rem}
.emailf .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.emailf .btn{margin:0}
.emailf .lnk{border:0;padding:6px 4px;text-decoration:underline}
.emailf .hint{color:var(--mut);font-size:.82rem;margin:0}
.conflict{margin-bottom:14px;border-color:var(--acc)}
.conflict p{margin:0 0 10px}
.conflict .acts{display:flex;flex-wrap:wrap;gap:8px}
.conflict .btn{margin:0}
.lbl{display:block;margin-bottom:4px}
.sel{display:flex;gap:8px;align-items:center}.sw{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1px solid var(--line)}
.btn{padding:9px 14px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;font:inherit;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.55;cursor:default}
.pname{color:var(--mut);font-size:.95rem;overflow-wrap:anywhere}
input.low{background:rgba(217,83,79,.2);border-color:#d9534f}
#mbar{display:none}.dl{display:none}@media(max-width:859px){.dl{display:inline}}
@media(max-width:859px){
 .wrap{padding:12px 12px 84px}
 .wm{height:38px}
 #mbar:not([hidden]){display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
 #mbar b{font-size:1.35rem}
 .tw{overflow:visible}
 table,tbody,tr,td{display:block}
 thead{display:none}
 tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
 td{padding:0;min-width:0}
 td::before{content:attr(data-label);display:block;font-size:.78rem;color:var(--mut);margin-bottom:3px}
 td:nth-child(1),td:nth-child(2),td:nth-child(3),td:nth-child(4),td:nth-child(5),td.x{grid-column:1/-1}
 td.x::before{display:none}
 td.x .btn{width:100%}
 td select,td input:not([type=color]){width:100%;min-width:0}
 .price{font-size:2.2rem}
}
</style>
</head>
<body>
<div class="wrap">
<h1 aria-label="Filakalk"><svg class="wm" viewBox="0 0 780 170" aria-hidden="true"><svg x="0" y="5" width="160" height="160" viewBox="0 0 512 512"><mask id="wmm"><rect width="512" height="512" fill="#fff"/><rect x="226" y="236" width="60" height="13" rx="6.5"/><rect x="226" y="264" width="60" height="13" rx="6.5"/></mask><g fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="256" cy="256" r="176" stroke-width="26"/><g stroke-width="10"><circle cx="256" cy="256" r="134"/><circle cx="256" cy="256" r="106"/><circle cx="256" cy="256" r="78"/></g><path d="M421 316C458 350 440 416 372 446" stroke-width="18"/></g><circle cx="256" cy="256" r="50" fill="currentColor" mask="url(#wmm)"/></svg><g transform="translate(200 8) scale(1.1)"><g fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path d="M20 120V50Q20 20 50 20M2 62H44"/><path d="M88 62V120"/><path d="M128 20V120"/><circle cx="180" cy="90" r="30"/><path d="M210 62V120"/><path d="M250 20V120M288 62 252 96M266 82 292 120"/><circle cx="348" cy="90" r="30"/><path d="M378 62V120"/><path d="M418 20V120"/><path d="M458 20V120M496 62 460 96M474 82 500 120"/></g><circle cx="88" cy="28" r="9" fill="currentColor" stroke="none"/></g></svg></h1>
<p class="sub">Kalkulátor 3D tisku – náklady a doporučená prodejní cena</p>
<div class="acct" id="acct" hidden><span class="who" id="who" hidden></span><button class="btn" id="login" type="button">Přihlásit se Googlem</button><button class="btn" id="loginEmail" type="button" aria-expanded="false" aria-controls="emailf">E-mail a heslo</button><button class="btn" id="logout" type="button" hidden>Odhlásit</button><span class="st" id="syncst" role="status"></span></div>
<form class="card emailf" id="emailf" hidden novalidate>
<label for="em_email">E-mail</label><input id="em_email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false">
<label for="em_pass">Heslo</label><input id="em_pass" type="password" autocomplete="current-password">
<p class="hint">Nový účet: heslo musí mít aspoň 6 znaků.</p>
<div class="acts"><button class="btn" id="emLogin" type="submit">Přihlásit</button><button class="btn" id="emCreate" type="button">Vytvořit účet</button><button class="btn lnk" id="emReset" type="button">Zapomenuté heslo</button></div>
</form>
<div class="card conflict" id="conflict" hidden><p><b>Data v tomto zařízení se liší od dat v účtu.</b> Která chcete používat? Druhá verze se přepíše.</p><div class="acts"><button class="btn" id="useRemote" type="button">Data z účtu</button><button class="btn" id="useLocal" type="button">Data z tohoto zařízení</button></div></div>
<div class="tabs" role="tablist">
<button role="tab" data-t="single">Jednobarevný</button>
<button role="tab" data-t="multi">Vícebarevný (AMS)</button>
<button role="tab" data-t="cat">Katalog filamentů</button>
</div>
<div id="app"></div>
<p class="ver" id="ver"></p>
<div class="palpop" id="palpop" role="dialog" aria-label="Výběr barvy" hidden></div>
<div id="mbar" hidden><span>Prodejní cena</span><b id="mp"></b></div>
</div>
<script>
const APP_VERSION='1.11.0';
const KEY='kalk3d_v1';
const COMMON=[['h','Doba tisku – hodiny','h'],['m','Doba tisku – minuty','min'],['kwh','Naměřená spotřeba (volitelné)','kWh'],['w','Příkon tiskárny (když kWh = 0)','W'],['el','Cena elektřiny','Kč/kWh'],['am','Amortizace a opotřebení','Kč/h'],['ph','Příprava / postprocessing – hodiny','h'],['pm','Příprava / postprocessing – minuty','min'],['rate','Sazba práce','Kč/h'],['risk','Riziková přirážka','%'],['mar','Obchodní marže','%']];
const DEF={tab:'single',mode:'markup',
 single:{g:62,pr:213,h:5,m:0,kwh:0,w:110,el:8,am:5,ph:0,pm:15,rate:150,risk:10,mar:30},
 multi:{f:[{n:'PLA Basic – Černá',g:40,p:213},{n:'PLA Basic – Bílá',g:15,p:520},{n:'PLA Basic – Červená',g:7,p:450},{n:'PLA Basic – Žlutá',g:0,p:450}],h:5,m:0,kwh:0,w:120,el:8,am:6,ph:0,pm:20,rate:150,risk:15,mar:30},
 cat:[['Bambu Lab','PLA Basic','#1a1a1a',520,'#f2f2f2'],['Devil Design','PLA','#9aa0a6',450],['Sunlu','PETG','#8a8f94',420],['Generic / Akce','PLA','#9aa0a6',213],['Professional Lab','TPU 95A','#1a1a1a',650],['Professional Lab','PLA Wood','#a9794c',580]]};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.single||!S.multi||!S.cat)S=JSON.parse(JSON.stringify(DEF));
const COL={'Černá / Bílá':'#1a1a1a','Černá':'#1a1a1a','Bílá':'#f2f2f2','Šedá':'#8a8f94','Dřevo':'#a9794c'};
S.cat.forEach(c=>{if(!/^#[0-9a-f]{6}$/i.test(c[2]))c[2]=COL[c[2]]||'#9aa0a6'});
const METAL='linear-gradient(135deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 30%,rgba(0,0,0,.3) 55%,rgba(255,255,255,.5) 80%,rgba(255,255,255,.1) 100%)';
const METALS=[['Zlatá','#d4af37'],['Stříbrná','#c0c0c0'],['Měděná','#b87333'],['Bronzová','#a97142'],['Mosazná','#b5a642'],['Ocelová','#71797e'],['Titanová','#878681'],['Růžové zlato','#b76e79'],['Grafitová','#4a4d52']];
const sw=sel=>{const c=sel!==''&&sel!=null&&S.cat[sel];if(!c)return'transparent';const base=c[4]?`linear-gradient(90deg,${c[2]} 50%,${c[4]} 50%)`:c[2];return c[6]?METAL+','+base:base};
const wTxt=c=>c[5]!==''&&c[5]!=null?` · <span${isLow(c[5])?' class="lowt"':''}>${esc(c[5])} g</span>`:'';
const ddText=v=>{const c=v!==''&&v!=null&&S.cat[v];return c?esc(c[0]+' '+c[1])+' – '+c[3]+' Kč'+wTxt(c):'Vybrat z katalogu…'};
const SORT_LABELS={brand:'Výrobce',type:'Typ',color:'Barva',price:'Kč/kg',weight:'Hmotnost'};
let catPin=null;
const catFilter={brand:'',type:'',color:'',stat:''};
const nearName=hex=>{
 const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||'');if(!m)return '';
 const v=[1,2,3].map(k=>parseInt(m[k],16));let best='',bd=1e12;
 PAL.forEach(([n,h])=>{const d=[0,1,2].reduce((a,k)=>a+(parseInt(h.substr(1+2*k,2),16)-v[k])**2,0);if(d<bd){bd=d;best=n}});
 return best;
};
const colGroups=c=>c[6]?['Kovové']:[nearName(c[2])].concat(c[4]?[nearName(c[4])]:[]);
const STATS=[['','Vše'],['low','Nízký stav (do 100 g)'],['noweight','Bez zadané hmotnosti'],['noprice','Bez ceny']];
const catMatch=c=>{
 if(catFilter.brand&&String(c[0]||'').trim()!==catFilter.brand)return false;
 if(catFilter.type&&String(c[1]||'').trim()!==catFilter.type)return false;
 if(catFilter.color&&!colGroups(c).includes(catFilter.color))return false;
 const st=catFilter.stat;
 if(st==='low'&&!(c[5]!==''&&c[5]!=null&&N(c[5])<=100))return false;
 if(st==='noweight'&&!(c[5]===''||c[5]==null))return false;
 if(st==='noprice'&&!(N(c[3])<=0))return false;
 return true;
};
const filtersActive=()=>!!(catFilter.brand||catFilter.type||catFilter.color||catFilter.stat);
function filterBar(){
 const cnt=(fn)=>{const m=new Map();S.cat.forEach(c=>{fn(c).forEach(v=>{if(v)m.set(v,(m.get(v)||0)+1)})});return m};
 const col=new Intl.Collator('cs',{numeric:true,sensitivity:'base'});
 const brands=cnt(c=>[String(c[0]||'').trim()]),types=cnt(c=>[String(c[1]||'').trim()]),cols=cnt(c=>colGroups(c));
 ['brand','type','color'].forEach(k=>{const m=k==='brand'?brands:k==='type'?types:cols;if(catFilter[k]&&!m.has(catFilter[k]))catFilter[k]=''});

function catOrder(pin){

 const colKey=hex=>{
  const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||'');if(!m)return null;
  const r=parseInt(m[1],16)/255,g=parseInt(m[2],16)/255,b=parseInt(m[3],16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  const sat=d===0?0:d/(1-Math.abs(2*l-1));

const sortBtn=(k,label)=>{
 const cs=S.catSort,on=!!(cs&&cs.by===k),asc=!(cs&&cs.dir<0);
 return `<button type="button" class="sb" data-sort="${k}" aria-pressed="${on}" aria-label="Řadit podle: ${label}${on?(asc?', nyní vzestupně':', nyní sestupně'):''}" title="${on?(asc?'Vzestupně, klepnutím sestupně':'Sestupně, klepnutím vzestupně'):'Řadit vzestupně'}"><span>${label}</span><span class="sa" aria-hidden="true"><i class="${on&&asc?'on':''}">▲</i><i class="${on&&!asc?'on':''}">▼</i></span></button>`;
};
const sortTh=(k,label)=>{const cs=S.catSort,on=cs&&cs.by===k;return `<th aria-sort="${on?(cs.dir<0?'descending':'ascending'):'none'}">${sortBtn(k,label)}</th>`};
const sortChips=()=>`<div class="sortchips" role="group" aria-label="Řazení"><span class="lbl2">Řadit:</span>${Object.entries(SORT_LABELS).map(([k,l])=>sortBtn(k,l)).join('')}</div>`;
const catVisible=()=>catOrder(catPin).filter(i=>i===catPin||catMatch(S.cat[i]));
const catCount=()=>{
 const parts=[],cs=S.catSort;
 if(filtersActive()){const n=catVisible().length;parts.push(`<span>${n?`Zobrazeno ${n} z ${S.cat.length}`:'Žádný filament neodpovídá filtrům.'}</span><button type="button" class="btn" id="fclear">Zrušit filtry</button>`)}
 if(cs&&cs.by&&cs.by!=='manual')parts.push(`<span>Řazeno: ${SORT_LABELS[cs.by]||''} ${cs.dir<0?'↓ sestupně':'↑ vzestupně'}</span><button type="button" class="btn" id="fsortclear">Zrušit řazení</button>`);
 return parts.length?`<div class="fcount" role="status">${parts.join('')}</div>`:'';
};
function catView(app){
 app.innerHTML=`<div class="card"><h2>Katalog filamentů</h2>${filterBar()}${catCount()}${sortChips()}<div class="tw"><table><thead><tr>${sortTh('brand','Výrobce')}${sortTh('type','Typ')}${sortTh('color','Barva')}${sortTh('price','Kč/kg')}${sortTh('weight','Hmotnost (g)')}<th></th></tr></thead><tbody>`+
 catVisible().map(i=>{const c=S.cat[i];return `<tr>${[0,1,2,3,5].map(j=>j===2?`<td data-label="Barva">${colorCell(c,i)}</td>`:j<2?`<td data-label="${j?'Typ':'Výrobce'}">${selCell(c,i,j)}</td>`:`<td data-label="${j===5?'Hmotnost (g)':'Cena (Kč/kg)'}"><input data-ci="${i}" data-cj="${j}" value="${esc(j===5?(c[5]??''):c[j])}" inputmode="decimal"${j===5&&isLow(c[5])?' class="low"':''}></td>`).join('')}<td class="x"><button class="btn" style="margin:0;padding:5px 9px" data-del="${i}" aria-label="Smazat řádek"><span aria-hidden="true">×</span><span class="dl"> Smazat</span></button></td></tr>`}).join('')+
 `</tbody></table></div><button class="btn" id="add">Přidat filament</button><p class="note">Ceny z katalogu se použijí ve výběru cívek na kartě Vícebarevný (AMS). Hmotnost (g) je množství filamentu na cívce; při 100 g a méně se pole podbarví červeně. Do pole lze napsat výpočet, např. 820-35, a po opuštění pole nebo Enteru se přepočítá (stačí i jen -35 k aktuální hodnotě). Klepnutím na barvu otevřete paletu: deset základních barev, kovové odstíny, vlastní barvu, kovový lesk a rozdělení na dvě barvy. Řazení: klepněte na název sloupce (na telefonu na tlačítka nad seznamem), šipka ukazuje vzestupně ▲ nebo sestupně ▼. Řazení a filtry se použijí při dalším zobrazení katalogu, ne během psaní do pole. Jsou jen pro zobrazení, pořadí ani obsah katalogu se nemění. Filtry se po obnovení stránky zruší.</p></div>`;
 const wExpr=(txt,prev)=>{const m=String(txt).replace(/[−–]/g,'-').match(/^\s*(\d+(?:[.,]\d+)?)?\s*((?:[-+]\s*\d+(?:[.,]\d+)?\s*)+)$/);if(!m)return null;if(m[1]==null&&(prev===''||prev==null))return null;let t=m[1]!=null?parseFloat(m[1].replace(',','.')):N(prev);(m[2].match(/[-+]\s*\d+(?:[.,]\d+)?/g)||[]).forEach(p=>{const n=parseFloat(p.replace(/\s/g,'').slice(1).replace(',','.'));t+=p.trim()[0]==='-'?-n:n});return Math.max(0,Math.round(t*10)/10)};
 app.querySelectorAll('[data-ci]').forEach(el=>{
  const i=el.dataset.ci,j=el.dataset.cj;
  el.oninput=()=>{
   if(j==='5'&&wExpr(el.value,S.cat[i][5])!==null)return;
   S.cat[i][j]=j==='3'?N(el.value):el.value;if(j==='5')el.classList.toggle('low',isLow(el.value));save()};
  if(j==='5'){
   const calc=()=>{const r=wExpr(el.value,S.cat[i][5]);if(r===null)return;el.value=r;S.cat[i][5]=String(r);el.classList.toggle('low',isLow(r));save()};
   el.onchange=calc;el.onblur=calc;el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();calc();el.blur()}};
   el.title='Lze zadat výpočet, např. 820-35 (zbývající hmotnost po tisku)';
  }
 });
 app.querySelectorAll('[data-cs]').forEach(el=>el.onchange=()=>{
  const i=el.dataset.cs,j=el.dataset.cj;
  if(el.value==='__other'){ED[i+'_'+j]=true;S.cat[i][j]='';save();view();return}
  S.cat[i][j]=el.value;save();
 });
 app.querySelectorAll('[data-ed]').forEach(el=>{el.onblur=()=>{delete ED[el.dataset.ed];view()};el.focus()});
 app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{closePal();S.cat.splice(b.dataset.del,1);catPin=null;save();view()});
 app.querySelectorAll('[data-fkey]').forEach(el=>el.onchange=()=>{catFilter[el.dataset.fkey]=el.value;catPin=null;closePal();view()});
 const fc=document.getElementById('fclear');if(fc)fc.onclick=()=>{catFilter.brand=catFilter.type=catFilter.color=catFilter.stat='';catPin=null;closePal();view()};
 app.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.sort,cs=S.catSort||{by:'manual',dir:1};
  S.catSort=cs.by===k?{by:k,dir:cs.dir<0?1:-1}:{by:k,dir:1};
  catPin=null;closePal();save();view();
 });
 const fsc=document.getElementById('fsortclear');if(fsc)fsc.onclick=()=>{S.catSort={by:'manual',dir:1};catPin=null;closePal();save();view()};
 app.querySelectorAll('[data-colbtn]').forEach(b=>b.onclick=()=>palOpen(+b.dataset.colbtn,b));
 document.getElementById('add').onclick=()=>{S.cat.push(['','','#9aa0a6',0,'','']);catPin=S.cat.length-1;save();view()};
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;subMsg='';catPin=null;save();view()});
view();
const verEl=document.getElementById('ver');
verEl.textContent='Filakalk verze '+APP_VERSION;
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
<script type="module">
import {initializeApp,getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc,serverTimestamp} from './vendor/firebase.js';
const FK=window.FK;
const cfg={apiKey:'AIzaSyD2b229Rm8cAgq8EhS98LpuSPiym1NbU70',authDomain:'filakalk-abcec.firebaseapp.com',projectId:'filakalk-abcec',storageBucket:'filakalk-abcec.firebasestorage.app',messagingSenderId:'761484950310',appId:'1:761484950310:web:de3adcc6005dc08ff55fe7'};
const $=id=>document.getElementById(id);
const META='kalk3d_sync';
const meta=()=>{try{return JSON.parse(localStorage.getItem(META))||{}}catch(e){return{}}};
const setMeta=m=>{try{localStorage.setItem(META,JSON.stringify(m))}catch(e){}};
const st=(t,err)=>{const e=$('syncst');e.textContent=t||'';e.classList.toggle('err',!!err)};
const app=initializeApp(cfg);
const auth=getAuth(app);
let db;
try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=initializeFirestore(app,{})}
let uid=null,ref=null,unsub=null,ready=false,timer=null;
$('acct').hidden=false;

const push=()=>{
 clearTimeout(timer);timer=null;
 if(!ready||!ref)return;
 const d=FK.data();
 if(d===meta().last)return;
 setMeta({uid,last:d});
 setDoc(ref,{data:d,updated:serverTimestamp(),app:FK.version}).catch(e=>st(errText(e),true));
};
FK.onSaved(()=>{if(ready&&ref){clearTimeout(timer);timer=setTimeout(push,800)}});

const errText=e=>{
 const c=(e&&e.code)||'';
 if(c==='auth/unauthorized-domain')return 'Tato adresa není ve Firebase mezi povolenými doménami.';
 if(c==='auth/operation-not-allowed')return 'Tento způsob přihlášení není ve Firebase zapnutý.';
 if(c==='auth/invalid-email')return 'Zadejte platný e-mail.';
 if(c==='auth/missing-password')return 'Zadejte heslo.';
 if(c==='auth/weak-password')return 'Heslo je příliš slabé, zadejte aspoň 6 znaků.';
 if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return 'E-mail nebo heslo nesedí. Pokud jste se dosud přihlašoval jen Googlem, použijte Zapomenuté heslo a nastavte si heslo.';
 if(c==='auth/email-already-in-use')return 'Tento e-mail už má účet. Přihlaste se, nebo použijte Zapomenuté heslo. Účet přes Google se spojí se stejným e-mailem.';
 if(c==='auth/too-many-requests')return 'Příliš mnoho pokusů, zkuste to za chvíli.';
 if(c==='auth/network-request-failed')return 'Bez internetu se nelze přihlásit.';
 if(c==='auth/popup-blocked')return 'Prohlížeč zablokoval přihlašovací okno. Povolte vyskakovací okna.';
 if(c==='permission-denied')return 'Databáze odmítla přístup. Zkontrolujte pravidla ve Firestore.';
 return 'Synchronizace selhala'+(c?' ('+c+')':'')+'.';
};

const decide=(choice,remote)=>{
 $('conflict').hidden=true;
 if(choice==='remote'){setMeta({uid,last:remote});FK.apply(remote)}
 else{setMeta({uid,last:''})}
 ready=true;
 if(choice!=='remote')push();
};
$('useRemote').onclick=()=>decide('remote',$('conflict').dataset.remote);
$('useLocal').onclick=()=>decide('local');

const onSnap=snap=>{
 const exists=snap.exists();
 const remote=exists?snap.get('data'):null;
 const fromCache=snap.metadata.fromCache;
 if(!ready){
  if(fromCache&&!exists){st('Čekám na připojení…');return}
  const local=FK.data(),m=meta();
  if(!exists){ready=true;setMeta({uid,last:''});push()}
  else if(remote===local){ready=true;setMeta({uid,last:remote})}
  else if(m.uid===uid&&local===m.last){ready=true;setMeta({uid,last:remote});FK.apply(remote)}
  else if(m.uid===uid&&remote===m.last){ready=true;push()}
  else if(FK.isDefault()){ready=true;setMeta({uid,last:remote});FK.apply(remote)}
  else{$('conflict').dataset.remote=remote;$('conflict').hidden=false;st('Vyberte, která data použít.');return}
 }else if(exists&&!snap.metadata.hasPendingWrites&&remote!==meta().last&&!timer){
  setMeta({uid,last:remote});
  if(remote!==FK.data())FK.apply(remote);
 }
 st(snap.metadata.hasPendingWrites?(navigator.onLine?'Ukládám…':'Offline – změny se odešlou po připojení'):fromCache?'Offline':'Synchronizováno');
};

onAuthStateChanged(auth,user=>{
 if(unsub){unsub();unsub=null}
 clearTimeout(timer);timer=null;ready=false;$('conflict').hidden=true;
 uid=user?user.uid:null;
 $('login').hidden=!!user;$('loginEmail').hidden=!!user;$('logout').hidden=!user;
 if(user){$('emailf').hidden=true;$('em_pass').value='';$('loginEmail').setAttribute('aria-expanded','false')}
 $('who').hidden=!user;$('who').textContent=user?(user.email||user.displayName||'Přihlášen'):'';
 if(!user){ref=null;st('Data jsou jen v tomto zařízení.');return}
 ref=doc(db,'users',uid);
 st('Načítám…');
 unsub=onSnapshot(ref,{includeMetadataChanges:true},onSnap,e=>st(errText(e),true));
});
$('login').onclick=()=>{st('');signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{if(e&&e.code==='auth/popup-closed-by-user'||e&&e.code==='auth/cancelled-popup-request')return;st(errText(e),true)})};
const emVals=()=>({e:$('em_email').value.trim(),p:$('em_pass').value});
const emBusy=b=>{['emLogin','emCreate','emReset'].forEach(i=>{$(i).disabled=b})};
const emRun=async(fn,okText)=>{
 st('');emBusy(true);
 try{await fn();if(okText)st(okText)}
 catch(e){st(errText(e),true)}
 finally{emBusy(false)}
};
$('loginEmail').onclick=()=>{const f=$('emailf');f.hidden=!f.hidden;$('loginEmail').setAttribute('aria-expanded',String(!f.hidden));if(!f.hidden)$('em_email').focus()};
$('emailf').onsubmit=ev=>{ev.preventDefault();const{e,p}=emVals();$('em_pass').autocomplete='current-password';emRun(()=>signInWithEmailAndPassword(auth,e,p))};
$('emCreate').onclick=()=>{const{e,p}=emVals();$('em_pass').autocomplete='new-password';emRun(()=>createUserWithEmailAndPassword(auth,e,p))};
$('emReset').onclick=()=>{const{e}=emVals();if(!e){st('Zadejte e-mail, na který pošleme odkaz pro nastavení hesla.',true);$('em_email').focus();return}
 emRun(()=>sendPasswordResetEmail(auth,e),'Pokud pro tento e-mail existuje účet, poslali jsme odkaz pro nastavení hesla. Zkontrolujte i spam.')};
$('logout').onclick=()=>{push();signOut(auth)};
window.addEventListener('online',()=>{if(ready)push()});
</script>
</body>
