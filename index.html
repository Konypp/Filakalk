<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulátor 3D tisku</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Kalkulátor 3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalkulátor 3D">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef3fa;--panel:#fff;--ink:#0f1e33;--mut:#546b87;--line:#d3deec;--acc:#1d4ed8;--accink:#fff;
--c1:#0b6b5c;--c2:#e0a100;--c3:#4a6fa5;--c4:#8a5a9e;--c5:#c4553a;--c6:#16211f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--panel:#121c2f;--ink:#e6eefc;--mut:#8fa3c2;--line:#233350;--acc:#5b9dff;--accink:#06142e;--c1:#3fc5ad;--c2:#f0b92e;--c3:#7f9fd0;--c4:#b98ccc;--c5:#e0806a;--c6:#e8efed}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--panel:#121c2f;--ink:#e6eefc;--mut:#8fa3c2;--line:#233350;--acc:#5b9dff;--accink:#06142e;--c1:#3fc5ad;--c2:#f0b92e;--c3:#7f9fd0;--c4:#b98ccc;--c5:#e0806a;--c6:#e8efed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Familjen Grotesk','Segoe UI',system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:0 0 auto;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:1.1fr .9fr;align-items:start}.res{position:sticky;top:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:1.05rem;margin:0 0 10px}
.f{display:grid;grid-template-columns:1fr 96px 56px;gap:8px;align-items:center;margin-bottom:8px}
.f label{font-size:.92rem}.f span{color:var(--mut);font-size:.85rem}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.fil{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.fil:first-of-type{border-top:0}.fil .w{grid-column:1/-1}
.fil small{color:var(--mut);display:block;font-size:.78rem}
.price{font-size:2.6rem;font-weight:700;line-height:1.1;margin:2px 0}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:12px 0;background:var(--line)}
.bar i{display:block;min-width:0}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
.tot{font-weight:700}
.note{color:var(--mut);font-size:.82rem;margin-top:10px}
table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
td,th{padding:5px 4px;text-align:left;font-size:.88rem}th{color:var(--mut);font-weight:500}
td input{min-width:80px}td input[type=color],.duo input{padding:0;border:0;background:none;cursor:pointer;height:34px}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0}input[type=color]::-moz-color-swatch{border:0}
.cc{display:flex;gap:6px;align-items:center}.cc .one{min-width:0;width:72px;border:1px solid var(--line);border-radius:6px}
.duo{display:flex;width:72px;height:34px;border:1px solid var(--line);border-radius:6px;overflow:hidden}.duo input{min-width:0;width:50%;border-radius:0}
.cc .btn{margin:0;padding:4px 8px;font-size:.85rem}
.cc .btn[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.dd{position:relative;width:100%}
.ddb{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ddb .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddl{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;max-height:280px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.ddl[hidden]{display:none}
.ddl li{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:6px;cursor:pointer}
.ddl li:hover,.ddl li[aria-selected=true]{background:var(--bg)}
.lowt{color:#c0392b;font-weight:700}
.lbl{display:block;margin-bottom:4px}
.sel{display:flex;gap:8px;align-items:center}.sw{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1px solid var(--line)}
.btn{padding:9px 14px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;font:inherit;cursor:pointer;margin-top:10px}
input.low{background:rgba(217,83,79,.2);border-color:#d9534f}
#mbar{display:none}.dl{display:none}@media(max-width:859px){.dl{display:inline}}
@media(max-width:859px){
 .wrap{padding:12px 12px 84px}
 h1{font-size:1.3rem}
 #mbar:not([hidden]){display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
 #mbar b{font-size:1.35rem}
 .tw{overflow:visible}
 table,tbody,tr,td{display:block}
 thead{display:none}
 tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
 td{padding:0;min-width:0}
 td::before{content:attr(data-label);display:block;font-size:.78rem;color:var(--mut);margin-bottom:3px}
 td:nth-child(1),td:nth-child(2),td:nth-child(5),td.x{grid-column:1/-1}
 td.x::before{display:none}
 td.x .btn{width:100%}
 td select,td input:not([type=color]){width:100%;min-width:0}
 .price{font-size:2.2rem}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Kalkulátor 3D tisku</h1>
<p class="sub">Náklady a doporučená prodejní cena</p>
<div class="tabs" role="tablist">
<button role="tab" data-t="single">Jednobarevný</button>
<button role="tab" data-t="multi">Vícebarevný (AMS)</button>
<button role="tab" data-t="cat">Katalog filamentů</button>
</div>
<div id="app"></div>
<div id="mbar" hidden><span>Prodejní cena</span><b id="mp"></b></div>
</div>
<script>
const KEY='kalk3d_v1';
const COMMON=[['h','Doba tisku – hodiny','h'],['m','Doba tisku – minuty','min'],['kwh','Naměřená spotřeba (volitelné)','kWh'],['w','Příkon tiskárny (když kWh = 0)','W'],['el','Cena elektřiny','Kč/kWh'],['am','Amortizace a opotřebení','Kč/h'],['ph','Příprava / postprocessing – hodiny','h'],['pm','Příprava / postprocessing – minuty','min'],['rate','Sazba práce','Kč/h'],['risk','Riziková přirážka','%'],['mar','Obchodní marže','%']];
const DEF={tab:'single',mode:'markup',
 single:{g:62,pr:213,h:5,m:0,kwh:0,w:110,el:8,am:5,ph:0,pm:15,rate:150,risk:10,mar:30},
 multi:{f:[{n:'PLA Basic – Černá',g:40,p:213},{n:'PLA Basic – Bílá',g:15,p:520},{n:'PLA Basic – Červená',g:7,p:450},{n:'PLA Basic – Žlutá',g:0,p:450}],h:5,m:0,kwh:0,w:120,el:8,am:6,ph:0,pm:20,rate:150,risk:15,mar:30},
 cat:[['Bambu Lab','PLA Basic','#1a1a1a',520,'#f2f2f2'],['Devil Design','PLA','#9aa0a6',450],['Sunlu','PETG','#8a8f94',420],['Generic / Akce','PLA','#9aa0a6',213],['Professional Lab','TPU 95A','#1a1a1a',650],['Professional Lab','PLA Wood','#a9794c',580]]};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.single||!S.multi||!S.cat)S=JSON.parse(JSON.stringify(DEF));
const COL={'Černá / Bílá':'#1a1a1a','Černá':'#1a1a1a','Bílá':'#f2f2f2','Šedá':'#8a8f94','Dřevo':'#a9794c'};
S.cat.forEach(c=>{if(!/^#[0-9a-f]{6}$/i.test(c[2]))c[2]=COL[c[2]]||'#9aa0a6'});
const sw=sel=>{const c=sel!==''&&sel!=null&&S.cat[sel];return c?(c[4]?`linear-gradient(90deg,${c[2]} 50%,${c[4]} 50%)`:c[2]):'transparent'};
const wTxt=c=>c[5]!==''&&c[5]!=null?` · <span${isLow(c[5])?' class="lowt"':''}>${esc(c[5])} g</span>`:'';
const ddText=v=>{const c=v!==''&&v!=null&&S.cat[v];return c?esc(c[0]+' '+c[1])+' – '+c[3]+' Kč'+wTxt(c):'Vybrat z katalogu…'};
const ddHTML=(id,v)=>`<div class="dd" data-dd="${id}"><button type="button" class="ddb" aria-haspopup="listbox" aria-expanded="false"><span class="sw" style="background:${sw(v)}"></span><span class="t">${ddText(v)}</span><span aria-hidden="true">▾</span></button><ul class="ddl" role="listbox" hidden><li role="option" data-v="" aria-selected="${v===''||v==null}"><span class="sw" style="background:transparent"></span>Vybrat z katalogu…</li>${S.cat.map((c,i)=>`<li role="option" data-v="${i}" aria-selected="${String(v)===String(i)}"><span class="sw" style="background:${sw(i)}"></span>${esc(c[0]+' '+c[1])} – ${c[3]} Kč${wTxt(c)}</li>`).join('')}</ul></div>`;
const ddSet=(id,v)=>{const e=document.querySelector('[data-dd="'+id+'"]');if(!e)return;e.querySelector('.ddb .sw').style.background=sw(v);e.querySelector('.ddb .t').innerHTML=ddText(v)};
let onPick=()=>{};
document.addEventListener('click',e=>{
 const li=e.target.closest('.ddl li'),b=e.target.closest('.ddb');
 document.querySelectorAll('.ddl').forEach(l=>{if(!b||!l.parentNode.contains(b)){l.hidden=true;l.previousElementSibling.setAttribute('aria-expanded','false')}});
 if(li){const dd=li.closest('.dd');if(li.dataset.v!=='')onPick(dd.dataset.dd,li.dataset.v)}
 else if(b){const l=b.nextElementSibling;l.hidden=!l.hidden;b.setAttribute('aria-expanded',String(!l.hidden))}
});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const kc=n=>(isFinite(n)?n:0).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' Kč';
const N=v=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)?v:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function calc(d,mat){
 const t=N(d.h)+N(d.m)/60;
 const el=N(d.kwh)>0?N(d.kwh)*N(d.el):t*N(d.w)/1000*N(d.el);
 const am=t*N(d.am), lab=(N(d.ph)+N(d.pm)/60)*N(d.rate);
 const direct=mat+el+am+lab, risk=direct*N(d.risk)/100, cost=direct+risk;
 const mr=Math.min(N(d.mar),99);
 const profit=cost/(1-mr/100)-cost;
 return{items:[['Filament',mat],['Elektřina',el],['Amortizace stroje',am],['Práce',lab],['Riziková rezerva',risk],['Zisk (marže)',profit]],cost,profit,price:cost+profit};
}
function result(){
 const tab=S.tab, d=S[tab];
 let mat=tab==='single'?N(d.g)/1000*N(d.pr):d.f.reduce((a,x)=>a+N(x.g)/1000*N(x.p),0);
 const r=calc(d,mat);
 const tot=r.price||1;
 const bar=r.items.map((it,i)=>`<i style="width:${Math.max(it[1],0)/tot*100}%;background:var(--c${i+1})" title="${it[0]}"></i>`).join('');
 const rows=r.items.slice(0,5).map((it,i)=>`<div class="row"><span><span class="dot" style="background:var(--c${i+1})"></span>${it[0]}</span><b>${kc(it[1])}</b></div>`).join('');
 document.getElementById('mp').textContent=kc(r.price);
 document.getElementById('res').innerHTML=`<h2>Doporučená prodejní cena</h2>${S.name?`<p class="sub" style="margin:0 0 6px">${esc(S.name)}</p>`:''}<div class="price">${kc(r.price)}</div>
 <div class="bar">${bar}</div>${rows}
 <div class="row tot"><span>Výrobní náklady</span><b>${kc(r.cost)}</b></div>
 <div class="row"><span><span class="dot" style="background:var(--c6)"></span>Zisk (marže)</span><b>${kc(r.profit)}</b></div>
 <div class="row tot"><span>Prodejní cena</span><b>${kc(r.price)}</b></div>`;
}
function fields(d,key){
 return COMMON.map(([k,l,u])=>`<div class="f"><label for="${key}_${k}">${l}</label><input id="${key}_${k}" data-k="${k}" inputmode="decimal" value="${d[k]}"><span>${u}</span></div>`).join('');
}
function bindFields(d){
 document.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{d[el.dataset.k]=el.value;clearMsg();save();result()});
}
let subMsg='',pend=null;
const clearMsg=()=>{subMsg='';pend=null;const m=document.getElementById('subm');if(m)m.textContent='';const c=document.getElementById('conf');if(c)c.innerHTML=''};
function subtract(items,force){
 const nm=(S.name||'').trim(),key=nm.toLowerCase();
 S.done=S.done||[];
 if(!force&&key&&S.done.some(x=>x.toLowerCase()===key)&&items.some(x=>N(x.g)>0)){pend=items;subMsg='';view();return}
 pend=null;
 const out=[];let did=false;
 items.forEach(({sel,g,label})=>{
  if(N(g)<=0)return;
  const c=sel!==''&&sel!=null&&S.cat[sel];
  if(!c){out.push(label+'vyberte filament z katalogu.');return}
  if(c[5]===''||c[5]==null){out.push(label+c[0]+' '+c[1]+': v katalogu chybí hmotnost.');return}
  const left=Math.max(0,Math.round((N(c[5])-N(g))*10)/10);
  c[5]=String(left);did=true;
  out.push(label+'odečteno '+N(g)+' g z '+c[0]+' '+c[1]+', zbývá '+left+' g'+'.');
 });
 subMsg=out.length?out.join(' '):'Není co odečíst, zadejte spotřebu.';
 if(did&&key&&!S.done.some(x=>x.toLowerCase()===key))S.done.push(nm);
 save();view();
}
function view(){
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===S.tab));
 document.getElementById('mbar').hidden=S.tab==='cat';
 const app=document.getElementById('app');
 if(S.tab==='cat'){catView(app);return}
 const d=S[S.tab];let first;
 if(S.tab==='single'){
  first=`<div class="card"><h2>Materiál</h2>
  <div style="margin-bottom:8px">${ddHTML('pick1',d.sel)}</div>
  <div class="f"><label for="g">Hmotnost výtisku</label><input id="g" data-k="g" inputmode="decimal" value="${d.g}"><span>g</span></div>
  <div class="f"><label for="pr">Cena filamentu</label><input id="pr" data-k="pr" inputmode="decimal" value="${d.pr}"><span>Kč/kg</span></div></div>`;
 }else{
  first=`<div class="card"><h2>Filamenty (až 4 cívky)</h2>`+d.f.map((x,i)=>`<div class="fil"><div class="w"><span class="lbl">Cívka ${i+1}</span>${ddHTML('p'+i,x.sel)}</div>
  <label><small>Spotřeba (g)</small><input data-fi="${i}" data-fk="g" inputmode="decimal" value="${x.g}"></label>
  <label><small>Cena za kg (Kč)</small><input data-fi="${i}" data-fk="p" inputmode="decimal" value="${x.p}"></label></div>`).join('')+`</div>`;
 }
 app.innerHTML=`<div class="grid"><div><div class="card" style="margin-bottom:14px"><h2>Projekt</h2><input id="pname" type="text" aria-label="Název projektu" placeholder="Název projektu" autocomplete="off" list="pnames" value="${esc(S.name||'')}"><datalist id="pnames">${(S.done||[]).map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>${first}<div class="card" style="margin-top:14px"><h2>Provoz a práce</h2>${fields(d,S.tab)}</div><button class="btn" id="sub" style="width:100%">Odečíst z cívky</button><div id="conf">${pend?`<div class="card" role="alertdialog" style="border-color:#d9534f;margin-top:10px"><b>Projekt „${esc(S.name)}“ už byl odečten.</b><br>Opravdu odečíst znovu?<div style="display:flex;gap:8px"><button class="btn" id="cyes" style="flex:1">Ano, odečíst</button><button class="btn" id="cno" style="flex:1">Zrušit</button></div></div>`:''}</div><p class="note" id="subm" role="status">${subMsg}</p></div><div class="card res" id="res"></div></div>`;
 bindFields(d);
 document.getElementById('pname').oninput=e=>{S.name=e.target.value;clearMsg();save();result()};
 if(pend){const p=pend;document.getElementById('cyes').onclick=()=>subtract(p,true);document.getElementById('cno').onclick=()=>{pend=null;view()}}
 document.getElementById('sub').onclick=()=>subtract(S.tab==='single'?[{sel:d.sel,g:d.g,label:''}]:d.f.map((x,i)=>({sel:x.sel,g:x.g,label:'Cívka '+(i+1)+': '})));
 if(S.tab==='single'){
  onPick=(id,v)=>{d.sel=v;d.pr=S.cat[v][3];save();view()};
  const pr=document.getElementById('pr'),old=pr.oninput;
  pr.oninput=()=>{old();clearMsg();d.sel='';ddSet('pick1','')};
 }
 if(S.tab==='multi'){
  app.querySelectorAll('[data-fi]').forEach(el=>el.oninput=()=>{
   const x=d.f[el.dataset.fi];x[el.dataset.fk]=el.value;clearMsg();
   if(el.dataset.fk!=='g'){x.sel='';ddSet('p'+el.dataset.fi,'')}
   save();result()});
  onPick=(id,v)=>{const i=+id.slice(1),c=S.cat[v];d.f[i].n=c[0]+' '+c[1];d.f[i].p=c[3];d.f[i].sel=v;save();view()};
 }
 result();
}
const BRANDS=['Bambu Lab','Prusament','Polymaker','eSUN','Sunlu','Creality','Elegoo','Anycubic','Overture','Eryone','Geeetech','Jayo','Kingroon','Devil Design','Professional Lab','Fillamentum','Filament PM','Fiberlogy','Extrudr','Spectrum','Add:north','Hatchbox'];
const TYPES=['PLA','PLA Basic','PLA Matte','PLA+','PLA+ 2.0','PLA Silk','PLA Wood','PLA-CF','PETG','PETG-CF','ABS','ASA','TPU 95A','TPU 85A','PA (nylon)','PC','PVA','HIPS'];
const ED={};
const isLow=v=>v!==''&&v!=null&&N(v)<=100;
const selCell=(c,i,j)=>{
 const k=i+'_'+j,v=c[j]||'',list=j===0?BRANDS:TYPES;
 if(ED[k])return `<input data-ci="${i}" data-cj="${j}" data-ed="${k}" aria-label="${j===0?'Výrobce':'Typ'}" value="${esc(v)}">`;
 return `<select data-cs="${i}" data-cj="${j}" aria-label="${j===0?'Výrobce':'Typ'}"><option value="">Vybrat…</option>${list.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}${v&&!list.includes(v)?`<option selected>${esc(v)}</option>`:''}<option value="__other">Jiný…</option></select>`;
};
const colorCell=(c,i)=>c[4]
 ?`<div class="cc"><div class="duo"><input data-ci="${i}" data-cj="2" type="color" aria-label="Levá půlka" value="${c[2]}"><input data-ci="${i}" data-cj="4" type="color" aria-label="Pravá půlka" value="${c[4]}"></div><button class="btn" data-c2off="${i}" aria-pressed="true" title="Dvě barvy zapnuty – klepnutím vrátíte jednu barvu" aria-label="Dělení barvy je zapnuté">½</button></div>`
 :`<div class="cc"><input class="one" data-ci="${i}" data-cj="2" type="color" aria-label="Barva" value="${c[2]}"><button class="btn" data-c2on="${i}" aria-pressed="false" title="Rozdělit na dvě barvy" aria-label="Dělení barvy je vypnuté">½</button></div>`;
function catView(app){
 app.innerHTML=`<div class="card"><h2>Katalog filamentů</h2><div class="tw"><table><thead><tr><th>Výrobce</th><th>Typ</th><th>Barva</th><th>Kč/kg</th><th>Hmotnost (g)</th><th></th></tr></thead><tbody>`+
 S.cat.map((c,i)=>`<tr>${[0,1,2,3,5].map(j=>j===2?`<td data-label="Barva">${colorCell(c,i)}</td>`:j<2?`<td data-label="${j?'Typ':'Výrobce'}">${selCell(c,i,j)}</td>`:`<td data-label="${j===5?'Hmotnost (g)':'Cena (Kč/kg)'}"><input data-ci="${i}" data-cj="${j}" value="${esc(j===5?(c[5]??''):c[j])}" inputmode="decimal"${j===5&&isLow(c[5])?' class="low"':''}></td>`).join('')}<td class="x"><button class="btn" style="margin:0;padding:5px 9px" data-del="${i}" aria-label="Smazat řádek"><span aria-hidden="true">×</span><span class="dl"> Smazat</span></button></td></tr>`).join('')+
 `</tbody></table></div><button class="btn" id="add">Přidat filament</button><p class="note">Ceny z katalogu se použijí ve výběru cívek na kartě Vícebarevný (AMS). Hmotnost (g) je množství filamentu na cívce; při 100 g a méně se pole podbarví červeně.</p></div>`;
 app.querySelectorAll('[data-ci]').forEach(el=>el.oninput=()=>{S.cat[el.dataset.ci][el.dataset.cj]=el.dataset.cj==='3'?N(el.value):el.value;if(el.dataset.cj==='5')el.classList.toggle('low',isLow(el.value));save()});
 app.querySelectorAll('[data-cs]').forEach(el=>el.onchange=()=>{
  const i=el.dataset.cs,j=el.dataset.cj;
  if(el.value==='__other'){ED[i+'_'+j]=true;S.cat[i][j]='';save();view();return}
  S.cat[i][j]=el.value;save();
 });
 app.querySelectorAll('[data-ed]').forEach(el=>{el.onblur=()=>{delete ED[el.dataset.ed];view()};el.focus()});
 app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.cat.splice(b.dataset.del,1);save();view()});
 app.querySelectorAll('[data-c2on]').forEach(b=>b.onclick=()=>{S.cat[b.dataset.c2on][4]=S.cat[b.dataset.c2on][2];save();view()});
 app.querySelectorAll('[data-c2off]').forEach(b=>b.onclick=()=>{S.cat[b.dataset.c2off][4]='';save();view()});
 document.getElementById('add').onclick=()=>{S.cat.push(['','','#9aa0a6',0,'','']);save();view()};
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;subMsg='';pend=null;save();view()});
view();
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
</body>
</html>
